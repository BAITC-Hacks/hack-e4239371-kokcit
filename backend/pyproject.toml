[project]
name = "windflow-api"
version = "0.1.0"
description = "Agentic wind power forecasting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1,<4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.7,<3",
    "reportlab>=4.4,<5",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
